name: dependabot-automerge

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    name: automerge
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for patch and minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Only BLOCKED proves a required check is gating the merge.
          # CLEAN/UNSTABLE would make gh merge immediately, skipping CI.
          state=UNKNOWN
          for _ in 1 2 3 4 5 6; do
            state="$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)"
            [ "$state" != UNKNOWN ] && break
            sleep 10
          done
          if [ "$state" != BLOCKED ]; then
            echo "::warning::mergeStateStatus=$state, so no required check gates main. Require the 'check' status on main to enable auto-merge. Leaving this PR for a human."
            exit 0
          fi
          if ! out="$(gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL" 2>&1)"; then
            echo "$out"
            if grep -qi 'auto.\?merge' <<<"$out"; then
              echo "::warning::Could not enable auto-merge. Turn on 'Allow auto-merge' in repo settings. Leaving this PR for a human."
              exit 0
            fi
            exit 1
          fi
          echo "$out"
