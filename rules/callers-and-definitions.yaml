# Structural rules used by prompts 1, 3 and 5. Semgrep is not a code
# graph, but its pattern engine can find call sites and definitions
# well enough to answer three of the five prompts and to show its edges
# and limits honestly against a `Read`+`Grep` baseline.
#
# Naming convention: each rule id encodes the prompt it serves so the
# harness can filter by rule metadata.

rules:
  # ---------------------------------------------------------------------
  # PROMPT 1: definition + callers of a named function
  # ---------------------------------------------------------------------
  #
  # The harness renders a FUNCTION placeholder at run time (e.g.
  # `giveGratitude` on gratibot). This rule matches direct call
  # expressions on that name and reports them all with file:line —
  # Semgrep's structural pass, not taint. Definitions are found via
  # the `pattern-definition` construct below.
  - id: liatrio.prompt-1.direct-caller
    message: Direct call site of the target function.
    severity: INFO
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          # Bare identifier call in the defining module.
          - pattern: $FUNC(...)
          # Method-style call via the exports object.
          - pattern: $OBJ.$FUNC(...)
    metadata:
      prompt: 1
      shape: direct-call

  - id: liatrio.prompt-1.function-definition
    message: Function definition.
    severity: INFO
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: async function $FUNC(...) { ... }
          - pattern: function $FUNC(...) { ... }
          - pattern: const $FUNC = async ($X, ...) => { ... }
          - pattern: const $FUNC = ($X, ...) => { ... }
    metadata:
      prompt: 1
      shape: definition

  # ---------------------------------------------------------------------
  # PROMPT 5: indirect call via framework registration (the discriminator)
  # ---------------------------------------------------------------------
  #
  # The pattern grep gets wrong: a function passed as a bare identifier
  # to a Bolt (or Next.js, or Express) registration call is *reached*
  # by string dispatch at runtime, not by a text call site with parens.
  # Semgrep can catch this shape structurally.
  - id: liatrio.prompt-5.bolt-event-registration
    message: Bolt event handler registration — target function is invoked by the framework, not by a direct call site.
    severity: INFO
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: $APP.event($EVENT, $HANDLER)
          - pattern: $APP.event($EVENT, $MATCHER, $HANDLER)
          - pattern: $APP.message($EMOJI, $HANDLER)
          - pattern: $APP.action($ACTION, $HANDLER)
    metadata:
      prompt: 5
      shape: framework-indirect

  - id: liatrio.prompt-5.express-route-registration
    message: Express route handler registration — indirect call site.
    severity: INFO
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: $APP.get($PATH, $HANDLER)
          - pattern: $APP.post($PATH, $HANDLER)
          - pattern: $ROUTER.use($PATH, $HANDLER)
    metadata:
      prompt: 5
      shape: framework-indirect
